<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Combi-diners - SOKI × De Kantine</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--cream, #F9F4EF); min-height: 100vh; padding: 2rem 1rem; }
    .kantine-wrap { max-width: 560px; margin: 0 auto; }
    .kantine-card { background: #fff; border-radius: 24px; padding: 2rem 1.75rem; box-shadow: 0 4px 32px rgba(74,28,12,0.1); }
    .kantine-title { font-size: 1.35rem; font-weight: 700; color: var(--brown, #4A1C0C); margin: 0 0 0.25rem; }
    .kantine-sub { color: var(--text-muted, #8C7B6B); font-size: 0.9rem; margin: 0 0 1.5rem; }
    .kantine-section { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--terra, #D94D1A); margin: 1.5rem 0 0.5rem; }
    .kantine-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 0.95rem; }
    .kantine-row:last-child { border-bottom: none; }
    .kantine-row .when { color: var(--brown, #4A1C0C); }
    .kantine-row .when small { color: var(--text-muted, #8C7B6B); display: block; font-size: 0.8rem; }
    .kantine-row .count { font-weight: 700; color: var(--brown, #4A1C0C); white-space: nowrap; text-align: right; }
    .kantine-row .count small { display: block; font-weight: 600; font-size: 0.75rem; color: var(--terra, #D94D1A); }
    .kantine-logos { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 1.25rem; }
    .kantine-logos img { display: block; }
    .kantine-today { background: #FFF6E8; border-radius: 10px; padding: 10px 12px; margin: 0 -12px; }
    .kantine-total { margin-top: 1.5rem; padding-top: 1rem; border-top: 2px dashed var(--border-color, #E8D5BF); display: flex; justify-content: space-between; font-weight: 700; color: var(--brown, #4A1C0C); }
    .kantine-empty { color: var(--text-muted, #8C7B6B); font-size: 0.9rem; padding: 0.5rem 0; }
    .loading, .error { color: var(--text-muted, #8C7B6B); padding: 2rem 0; text-align: center; }
    .error { color: #C62828; }
    .scan-btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--terra, #D94D1A); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; }
    .scan-btn:disabled { opacity: .6; }
    .scan-btn.secondary { background: #fff; color: var(--brown, #4A1C0C); border: 2px solid var(--border-color, #E8D5BF); }
    .scan-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 50; }
    .scan-overlay.open { display: block; }
    .scan-overlay video { width: 100%; height: 100%; object-fit: cover; }
    .scan-frame { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; transform: translate(-50%,-50%); border: 3px solid #fff; border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    #scanCancel { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 12px 28px; border: none; border-radius: 999px; background: #fff; color: #4A1C0C; font-weight: 700; cursor: pointer; font-family: inherit; }
    .scan-result { margin-top: 1rem; border-radius: 12px; padding: 14px; font-size: .95rem; line-height: 1.45; }
    .scan-result.ok { background: #E8F5E9; color: #1B5E20; }
    .scan-result.warn { background: #FFF3E0; color: #B45309; }
    .scan-result.bad { background: #FFEBEE; color: #C62828; }
    .scan-result .big { font-size: 1.2rem; font-weight: 700; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
<div class="kantine-wrap">
  <div class="kantine-card" id="card">
    <div class="loading">Laden…</div>
  </div>
  <div class="kantine-card" id="scanCard" style="display:none; margin-top:1rem;">
    <h2 class="kantine-title" style="font-size:1.1rem;">Ticket scannen</h2>
    <p class="kantine-sub" style="margin-bottom:1rem;">Scan de QR-code op het SOKI-ticket van de gast. Je ziet alleen of de combi-deal geldig is - geen persoonsgegevens.</p>
    <button class="scan-btn" id="scanBtn">📷 Scan combi-ticket</button>
    <div id="scanResult"></div>
  </div>
</div>

<div class="scan-overlay" id="scanOverlay">
  <video id="scanVideo" autoplay muted playsinline></video>
  <div class="scan-frame"></div>
  <button id="scanCancel">Annuleren</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
(function() {
  var key  = new URLSearchParams(location.search).get('key');
  var card = document.getElementById('card');

  if (!key) { card.innerHTML = '<div class="error">Ongeldige link.</div>'; return; }

  fetch('/api/kantine/combi?key=' + encodeURIComponent(key))
    .then(function(r) { return r.json(); })
    .then(function(rows) {
      if (rows.error) { card.innerHTML = '<div class="error">' + esc(rows.error) + '</div>'; return; }

      var today = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Amsterdam' }).format(new Date());
      var upcoming = [], past = [], total = 0, totalHuurders = 0;
      rows.forEach(function(r) {
        r.day = String(r.date).slice(0, 10);
        total += r.diners;
        totalHuurders += r.huurders || 0;
        (r.day >= today ? upcoming : past).push(r);
      });
      upcoming.sort(function(a, b) { return (a.day + a.start_time) < (b.day + b.start_time) ? -1 : 1; });

      var html =
        '<div class="kantine-logos">' +
          '<img src="/images/soki-logo-brown.png" alt="SOKI" style="width:120px;">' +
          '<img src="/images/kantine-logo.png" alt="De Kantine" style="height:104px;">' +
        '</div>' +
        '<h1 class="kantine-title">Combi-diners SOKI × De Kantine</h1>' +
        '<p class="kantine-sub">Aantal geboekte 2-gangendiners per saunasessie. Deze pagina is altijd actueel - ververs voor de laatste stand.</p>';

      html += '<div class="kantine-section">Vandaag &amp; komende sessies</div>';
      html += upcoming.length
        ? upcoming.map(function(r) { return rowHTML(r, r.day === today); }).join('')
        : '<div class="kantine-empty">Nog geen combi-diners geboekt voor komende sessies.</div>';

      if (past.length) {
        var months = {};
        past.forEach(function(r) {
          var key = r.day.slice(0, 7);
          if (!months[key]) months[key] = { diners: 0, huurders: 0, sessions: 0 };
          months[key].diners   += r.diners;
          months[key].huurders += r.huurders || 0;
          months[key].sessions++;
        });
        html += '<div class="kantine-section">Archief per maand</div>';
        html += Object.keys(months).sort().reverse().map(function(key) {
          var m = months[key];
          var p = key.split('-').map(Number);
          var label = new Date(p[0], p[1] - 1, 1).toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });
          return '<div class="kantine-row">' +
            '<span class="when">' + esc(label) + '<small>' + m.sessions + ' sessie' + (m.sessions === 1 ? '' : 's') + '</small></span>' +
            '<span class="count">' + m.diners + ' diner' + (m.diners === 1 ? '' : 's') +
              (m.huurders > 0 ? '<small>waarvan ' + m.huurders + ' huurder' + (m.huurders === 1 ? '' : 's') + '</small>' : '') +
            '</span>' +
          '</div>';
        }).join('');
      }

      html += '<div class="kantine-total"><span>Totaal verkocht</span><span>' + total + ' diners</span></div>';
      if (totalHuurders > 0) {
        html += '<div class="kantine-sub" style="margin:0.5rem 0 0;text-align:right;">waarvan ' + totalHuurders + ' huurder' + (totalHuurders === 1 ? '' : 's') + ' (betalen €10 i.p.v. €12)</div>';
      }
      card.innerHTML = html;
    })
    .catch(function() { card.innerHTML = '<div class="error">Verbindingsfout. Probeer opnieuw.</div>'; });

  function rowHTML(r, isToday) {
    var d = r.day.split('-').map(Number);
    var dateStr = new Date(d[0], d[1] - 1, d[2]).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    return '<div class="kantine-row' + (isToday ? ' kantine-today' : '') + '">' +
      '<span class="when">' + esc(dateStr) + (isToday ? ' · vandaag' : '') +
        '<small>' + esc(r.session_name) + ' · ' + esc(String(r.start_time).slice(0, 5)) + '–' + esc(String(r.end_time).slice(0, 5)) + '</small></span>' +
      '<span class="count">' + r.diners + ' diner' + (r.diners === 1 ? '' : 's') +
        (r.huurders > 0 ? '<small>waarvan ' + r.huurders + ' huurder' + (r.huurders === 1 ? '' : 's') + '</small>' : '') +
      '</span>' +
    '</div>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();

// ─── Ticketscanner ────────────────────────────────────────────────────────────
(function() {
  var key = new URLSearchParams(location.search).get('key');
  if (!key) return;

  document.getElementById('scanCard').style.display = '';
  var resultEl  = document.getElementById('scanResult');
  var overlay   = document.getElementById('scanOverlay');
  var video     = document.getElementById('scanVideo');
  var stream    = null, scanning = false;
  var canvas    = document.createElement('canvas');
  var ctx       = canvas.getContext('2d', { willReadFrequently: true });

  document.getElementById('scanBtn').addEventListener('click', startScan);
  document.getElementById('scanCancel').addEventListener('click', stopScan);

  function startScan() {
    resultEl.innerHTML = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      show('bad', 'Camera niet beschikbaar', 'Gebruik een telefoon of tablet met camera.');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(s) {
        stream = s;
        video.srcObject = s;
        video.play();
        overlay.classList.add('open');
        scanning = true;
        requestAnimationFrame(tick);
      })
      .catch(function() {
        show('bad', 'Geen toegang tot camera', 'Geef de browser toestemming om de camera te gebruiken en probeer opnieuw.');
      });
  }

  function stopScan() {
    scanning = false;
    overlay.classList.remove('open');
    if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      var img  = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code && code.data) { stopScan(); handleCode(code.data); return; }
    }
    requestAnimationFrame(tick);
  }

  function handleCode(text) {
    var bid = null, sig = null;
    try {
      var u = new URL(text, location.origin);
      bid = u.searchParams.get('bid');
      sig = u.searchParams.get('sig');
    } catch (e) {}
    if (!bid || !sig) {
      show('bad', 'Geen SOKI-ticket', 'Deze QR-code is geen geldig SOKI-ticket.');
      return;
    }
    resultEl.innerHTML = '<div class="scan-result warn">Controleren…</div>';
    fetch('/api/kantine/scan/' + encodeURIComponent(bid) + '?sig=' + encodeURIComponent(sig) + '&key=' + encodeURIComponent(key))
      .then(function(r) { return r.json(); })
      .then(function(info) { renderInfo(bid, sig, info); })
      .catch(function() { show('bad', 'Verbindingsfout', 'Probeer opnieuw.'); });
  }

  function renderInfo(bid, sig, info) {
    if (info.error && info.combi === undefined) { show('bad', 'Ongeldig ticket', esc(info.error)); return; }

    var today   = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Amsterdam' }).format(new Date());
    var day     = String(info.date).slice(0, 10);
    var d       = day.split('-').map(Number);
    var dateStr = new Date(d[0], d[1] - 1, d[2]).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
    var detail  = esc(dateStr) + ' · ' + esc(String(info.start_time).slice(0, 5)) + ' uur · ' + esc(info.session_name);

    if (!info.combi) { show('bad', 'Geen combi-deal', 'Bij deze boeking is geen diner geboekt.<br>' + detail); return; }
    if (info.status !== 'confirmed') {
      show('bad', 'Boeking niet geldig', 'Deze boeking is ' + (info.status === 'cancelled' ? 'geannuleerd' : 'niet bevestigd') + '.<br>' + detail);
      return;
    }
    if (info.redeemed_at) {
      var t = new Date(info.redeemed_at).toLocaleString('nl-NL', { timeZone: 'Europe/Amsterdam', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
      show('warn', 'Al verzilverd', 'Dit ticket is al verzilverd op ' + esc(t) + '.<br>' + detail);
      return;
    }
    var warnDay = day !== today ? '<br><strong>Let op: dit ticket is voor ' + esc(dateStr) + ', niet vandaag.</strong>' : '';
    show('ok', '✓ Geldige combi-deal — ' + info.diners + ' diner' + (info.diners === 1 ? '' : 's'), detail + warnDay,
      { bid: bid, sig: sig, diners: info.diners });
  }

  function show(type, title, bodyHtml, redeem) {
    var html = '<div class="scan-result ' + type + '"><span class="big">' + title + '</span>' + bodyHtml + '</div>';
    if (redeem) html += '<button class="scan-btn" id="redeemBtn" style="margin-top:0.75rem;">Markeer als verzilverd (' + redeem.diners + ' diner' + (redeem.diners === 1 ? '' : 's') + ')</button>';
    html += '<button class="scan-btn secondary" id="rescanBtn" style="margin-top:0.75rem;">Opnieuw scannen</button>';
    resultEl.innerHTML = html;
    var rb = document.getElementById('redeemBtn');
    if (rb) rb.addEventListener('click', function() { doRedeem(redeem, rb); });
    document.getElementById('rescanBtn').addEventListener('click', startScan);
  }

  function doRedeem(r, btnEl) {
    btnEl.disabled = true;
    fetch('/api/kantine/redeem/' + encodeURIComponent(r.bid) + '?sig=' + encodeURIComponent(r.sig) + '&key=' + encodeURIComponent(key), { method: 'POST' })
      .then(function(res) { return res.json(); })
      .then(function(out) {
        if (out.redeemed) {
          show('ok', '✓ Verzilverd', r.diners + ' diner' + (r.diners === 1 ? '' : 's') + ' geregistreerd. Eet smakelijk!');
        } else if (out.already_redeemed) {
          show('warn', 'Al verzilverd', 'Dit ticket was al eerder verzilverd.');
        } else {
          show('bad', 'Mislukt', esc(out.error || 'Probeer opnieuw.'));
        }
      })
      .catch(function() { show('bad', 'Verbindingsfout', 'Probeer opnieuw.'); });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
